name: Generate unique dish photos
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum images to generate in this run (0 = all remaining)"
        required: false
        default: "0"
permissions:
  contents: write
concurrency:
  group: dish-image-generation
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate one image per menu entry
        env:
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          IMAGE_MODEL: black-forest-labs/flux.1-schnell
          IMAGE_CONCURRENCY: "2"
        run: node scripts/generate-dish-images.cjs --limit "${{ inputs.limit }}"
      - name: Commit generated images to main
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add menu-data.js assets/dishes
          if git diff --cached --quiet; then
            echo "No generated image files to commit."
          else
            git commit -m "Add unique AI-generated photos for menu dishes"
            git push origin HEAD:main
          fi